<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7ecbff"/>
            <stop offset="1" stop-color="#d8f1ff"/>
        </linearGradient>
    </defs>

    <!-- sky -->
    <rect width="1600" height="900" fill="url(#sky)"/>

    <!-- sun -->
    <circle cx="1380" cy="150" r="140" fill="#fff3a0" opacity="0.5"/>
    <circle cx="1380" cy="150" r="90" fill="#ffd93b"/>

    <!-- clouds -->
    <g fill="#ffffff">
        <ellipse cx="250" cy="150" rx="90" ry="45"/>
        <ellipse cx="320" cy="125" rx="70" ry="50"/>
        <ellipse cx="380" cy="155" rx="80" ry="40"/>

        <ellipse cx="800" cy="220" rx="70" ry="35"/>
        <ellipse cx="860" cy="195" rx="60" ry="42"/>
        <ellipse cx="915" cy="225" rx="65" ry="32"/>
    </g>

    <!-- hills -->
    <path d="M0 640 Q 300 520 650 640 T 1300 620 T 1600 600 V900 H0 Z" fill="#8fd16a"/>
    <path d="M0 740 Q 400 640 800 740 T 1600 720 V900 H0 Z" fill="#6bbf4a"/>

    <!-- flowers -->
    <g>
        <circle cx="150" cy="800" r="10" fill="#ff6fa8"/>
        <circle cx="420" cy="830" r="10" fill="#ffd93b"/>
        <circle cx="700" cy="790" r="10" fill="#ff8a3d"/>
        <circle cx="1000" cy="820" r="10" fill="#ff6fa8"/>
        <circle cx="1280" cy="800" r="10" fill="#b77bff"/>
        <circle cx="1500" cy="840" r="10" fill="#ffd93b"/>
    </g>
</svg>
